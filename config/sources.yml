    publisher: rbi
    url: https://www.rbi.org.in/pressreleases_rss.xml
    tier: wire
    region: india
    terms_url: https://www.rbi.org.in/Scripts/Disclaimer.aspx
    # Emits 'Tue, 11 Aug 2026 10:30:00' with no tz -> needs default_tz + the
    # fallback date parser in normalize.py. feedparser returns None here.

  - id: sebi_updates
    name: SEBI
    publisher: sebi
    url: https://www.sebi.gov.in/sebirss.xml
    tier: wire
    region: india
    terms_url: https://www.sebi.gov.in/terms-of-use.html
    # Emits NO dates at all (probed: 0/30 entries dated) — every item flows
    # through normalize.py's undated->now path. Also overwhelmingly enforcement
    # paperwork; the "Release/Adjudication/Settlement Order" hard-excludes in
    # watchlist.yml are what make this feed worth carrying for its circulars.
    max_entries: 25
    timeout_seconds: 35   # slow origin; timed out at the 20s default


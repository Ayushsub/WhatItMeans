# RSS/Atom sources. India-first + global macro that transmits into India.
#
# COMPLIANCE CONTRACT (plan Part 6): every source records where its terms live
# and how much text we may reproduce. A source whose terms are unclear, or that
# actively blocks automated access, is excluded — not worked around. We take
# headline + short snippet + link only, never full article text: Indian fair
# dealing (Copyright Act s.52) is narrower than US fair use.
#
# snippet_max_words is enforced in pipeline/normalize.py, not by convention.
#
# ---------------------------------------------------------------------------
# id vs publisher vs name — these are three different things, on purpose.
#
#   id         the FEED. Unique per row. Used for the conditional-GET cache.
#   publisher  the MASTHEAD. Shared across every feed one newsroom operates.
#   name       what a READER sees in the attribution line — the masthead, not
#              the desk, because "reported by Economic Times Markets and
#              Economic Times Stocks" reads as two outlets when it is one.
#
# publisher is load-bearing. Corroboration (the largest term in the ranking
# score) and the reader-facing "N sources" count are both computed per
# publisher. Get it wrong and one newsroom's editorial focus decides which
# stories get an LLM call. Feeds of the same newsroom MUST share a publisher.
# ---------------------------------------------------------------------------
#
# EXCLUDED after probing (do not re-add without checking robots/terms):
#
#   Refuse automated access (HTTP 403) — a 403 to a self-identifying bot is a
#   clear "no", and evading it would breach the terms this pipeline exists to
#   respect:
#     business-standard.com  pib.gov.in  ndtvprofit.com  firstpost.com
#     bls.gov  imf.org  home.treasury.gov
#
#   Broken or empty:
#     financialexpress.com   WordPress feeds disabled (HTML/410)
#     bankofengland.co.uk    404
#     zeebiz.com             404
#     deccanherald.com       500
#     rbi.org.in speeches    200 but zero entries
#
#   Excluded on TERMS — these redistribute other outlets' reporting and their
#   terms restrict onward redistribution. Unclear terms means excluded, not
#   assumed fine:
#     finance.yahoo.com  investing.com  seekingalpha.com
#
#   Excluded on QUALITY — thin feeds dominated by ticker filler ("gold price
#   prediction today"), which would consume the per-feed budget with noise:
#     timesofindia.indiatimes.com/business  hindustantimes.com/business
#
# default_tz matters: several Indian feeds emit RFC-822 dates with NO timezone.
# Assuming UTC would backdate them 5.5h and age them out of the 24h window early.

defaults:
  snippet_max_words: 40
  attribution_required: true
  timeout_seconds: 20
  default_tz: Asia/Kolkata
  # Per-feed ceiling. Indian Express and News18 return 200 entries each;
  # uncapped, two feeds would supply a third of the corpus and skew clustering
  # toward whatever those desks cover. Feeds are newest-first, so this keeps
  # the most recent items.
  max_entries: 40


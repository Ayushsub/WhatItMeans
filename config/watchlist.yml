# Deterministic watchlist. No LLM involved (plan Part 4, step 5).
#
# Matching is alias-based over title + snippet, word-boundary anchored and
# case-insensitive. Aliases exist because feeds are inconsistent: "HDFC Bank",
# "HDFCBANK", "HDFC Bk" are the same entity.
#
# This file both TAGS clusters and feeds the ranking score, so weights here
# directly control which stories get an LLM call. Tune weight, not thresholds.

# Macro themes are the highest-value signal: they have the longest transmission
# chains, which is exactly what this site explains.
macro_themes:
  - id: policy_rate
    label: Interest Rates
    weight: 10
    aliases: [repo rate, reverse repo, policy rate, MPC, monetary policy, rate cut,
              rate hike, CRR, SLR, basis points, bps, FOMC, fed funds, Federal Reserve,
              interest rate, easing cycle, tightening cycle, VRRR, LAF]
  - id: inflation
    label: Inflation
    weight: 9
    aliases: [CPI, WPI, inflation, retail inflation, core inflation, food inflation,
              deflation, price rise, PCE]
  - id: currency
    label: Currency
    weight: 8
    aliases: [rupee, USDINR, USD/INR, dollar index, DXY, forex reserves, currency
              depreciation, currency appreciation, exchange rate]
  - id: crude
    label: Crude & Energy
    weight: 8
    aliases: [crude oil, Brent, WTI, OPEC, oil price, natural gas, LPG, petrol price,
              diesel price, energy prices]
  - id: fiscal
    label: Fiscal & Budget
    weight: 8
    aliases: [fiscal deficit, budget, Union Budget, government borrowing, capex,
              divestment, disinvestment, GST, tax rate, customs duty, subsidy]
  - id: trade
    label: Trade & Tariffs
    weight: 7
    aliases: [tariff, trade deficit, exports, imports, FTA, trade pact, trade deal,
              WTO, sanctions, export ban, import duty]
  - id: flows
    label: Institutional Flows
    weight: 6
    aliases: [FII, FPI, DII, foreign inflows, foreign outflows, mutual fund inflows,
              SIP inflows, institutional buying, institutional selling]
  - id: credit
    label: Credit & Liquidity
    weight: 7
    aliases: [bond yield, G-sec, gilt, credit growth, deposit growth, NPA, asset
              quality, liquidity, bank credit, corporate bond, yield curve]
  - id: gdp
    label: Growth
    weight: 7
    aliases: [GDP, GVA, economic growth, IIP, industrial production, PMI, recession,
              slowdown, unemployment, jobs report, payrolls]


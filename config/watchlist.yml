# HARD EXCLUDE — dropped at normalize, never enters a cluster.
#
# These are broker recommendation articles ("Buy HDFC Bank; target of Rs 1,850").
# Ingesting them is a compliance hazard: the source material IS a recommendation,
# so every downstream stage would be fighting to scrub it back out. Cheaper and
# safer to never let them in. Treated as regex, case-insensitive.
# Real example seen on moneycontrol_latest during feed probing.
hard_exclude_patterns:
  - '^\s*(buy|sell|hold|accumulate|reduce|add)\b.{0,60}\btarget\b'
  - '\btarget (price|of)\b'
  - '\b(buy|sell) call\b'
  - '\bstocks? to (buy|sell)\b'
  - '\btop (stock )?picks?\b'
  - '\bbuy or sell\b'
  - '\bshould you (buy|sell|invest)\b'
  - '\bmultibagger\b'
  - '\b(brokerage|analyst)s? (say|says|recommend)\b'
  - '\bstop loss\b'
  - '\bintraday (pick|call|trade|stock)'
  - '\btrade setup\b'
  - '\bmuhurat\b'
  # IPO subscription-advice framing. "Apply or not?" and "Should you subscribe"
  # are recommendations in headline form; GMP (grey market premium) coverage is
  # both low-value and adjacent to unregulated price speculation.
  - '\bapply or not\b'
  - '\bshould you (subscribe|apply)\b'
  - '\bIPO Day \d'
  - '\bGMP\b'
  - '\bgrey market premium\b'
  # RBI OPERATIONAL NOTICES — routine daily liquidity plumbing, not news.
  # These scored #1 on the first real run purely because rbi_press is a wire
  # source and the text matches rate/liquidity themes. They are data releases.
  # Deliberately narrow so genuine policy decisions (repo rate changes, MPC
  # statements) still pass through.
  - '\bMoney Market Operations as on\b'
  - '\bVariable Rate (Reverse )?Repo\b'
  - '\bVRRR\b'
  - '\bauction under LAF\b'
  - '^Result of the .{0,40}auction\b'
  - '\b(91|182|364)[- ]day Treasury Bills?\b'
  - '\bAuction of State Government Securities\b'
  - '\bUnderwriting Auction\b'
  - '\bDaily Reference Rate\b'
  # Auto-generated ticker pages. One outlet emits ~14 of these per run
  # ("Bajaj Finserv Share Price Live Updates: ... Stock Details"); they carry no
  # story, cluster together into a large meaningless blob, and crowd the feed.
  - '\bShare Price Live Updates\b'
  - '\bStock (Details|Price Overview)\b'
  - "\\bMarket Engagement\\b"
  # Market PREDICTION framing. Compliance-adjacent: a headline forecasting index
  # levels is the kind of forward call the site must never carry.
  - '\b(Nifty|Sensex|market).{0,30}\bprediction\b'
  - '\bhow .{0,30}(is|are) expected to trade\b'
  - '\bwhat lies ahead\b'
  # SEBI ENFORCEMENT PAPERWORK. The SEBI feed is carried for its circulars and
  # policy decisions, but most recent items are orders against individuals
  # ("Release Order - <name> [Defaulter]"). Those are legal notices, not market
  # news: no transmission mechanism, and naming private individuals on a news
  # site invites a takedown request for zero editorial value.
  - '\b(Release|Adjudication|Settlement|Prohibitive|Attachment) Order\b'
  - '\bRecovery Certificate\b'
  - '\bOrder in the matter of\b'
  - '\bshow cause notice\b'
  # DAILY PRICE-TICKER FILLER from the consumer-facing desks. Auto-generated,
  # no cause to explain, and it clusters into one large meaningless blob.
  - '\b(gold|silver) (rate|price) today\b'
  - '\b(petrol|diesel) price(s)? today\b'
  - '\bprice prediction\b'
  - '\bclosing bell\b'
  # Listicles and clickbait — no transmission mechanism to explain.
  - '\bamong \d+ (stocks|shares|companies)\b'
  - '\b\d+ (key )?things (you|to) (must|should) know\b'
  - '\byou must know\b'
  - '\bheatmap\b'

# SOFT NOISE — kept, but scored down in rank.py. A big story can still outweigh
# a noisy headline pattern, so this is a weight and not a filter.
noise_patterns:
  # DAILY MARKET WRAPS. Soft, not hard, and that distinction is deliberate:
  # "Sensex ends 43 points higher" is worthless every day of the year EXCEPT
  # the day it is "Sensex ends 1,400 points lower", which is a real story with
  # a real mechanism. A hard exclude would drop the one day that matters.
  # Scored down instead, so a genuinely large move can still outweigh it.
  # Measured: these merge into a single 21-article blob that topped the ranking.
  - "stock market today"
  - "sensex today"
  - "stock market live"
  - "market wrap"
  - "sensex ends"
  - "nifty ends"
  - "markets end"
  - "benchmarks flatline"
  - horoscope
  - astrology
  - "IPO GMP"
  - "grey market premium"
  - "stocks to watch"
  - "technical view"
  - "F&O ban"
  - "gold rate today"
  - "silver rate today"
  - "petrol and diesel price today"
  - "sponsored"
  - "partnered content"
  - "live updates"
  - "LIVE blog"
  - "day in pics"
  - "photos"
